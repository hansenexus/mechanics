name: release

# Publishes to npm from CI, with provenance, over Trusted Publishing.
#
# Provenance is the point. Published from a laptop, `repository` in
# package.json is an unverifiable claim: anyone can point a package at any
# repo. Published from here, npm records a signed attestation tying the
# tarball to this workflow, this repo and the exact commit — which is what
# makes the npm page's "Repository" link mean something.
#
# There is no NPM_TOKEN. npm trusts this workflow by OIDC: the runner presents
# a short-lived identity token, and npm checks it against the trusted publisher
# configured on the package. Nothing to rotate, nothing to leak, and no
# token needing the 2FA-bypass flag that a CI-usable classic token requires.
#
# Configured at npmjs.com → the package → Settings → Trusted Publisher:
#
#     Organization or user   hansenexus
#     Repository             mechanics
#     Workflow filename      release.yml
#     Environment            (blank)
#
# Renaming this file, or moving the job to another workflow, breaks publishing
# until that field is updated to match.
#
# Requires `id-token: write`, a public repo, and npm >= 11.5.1 — newer than the
# npm bundled with any current setup-node, hence the upgrade step below. The
# `repository` URL in package.json must match this repo or npm rejects the
# attestation.
#
# Trigger: push a `v<version>` tag. The tag is the release; the workflow
# refuses to publish if it disagrees with package.json, because a mismatch
# would put a version on npm that no tag in this repo describes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than any setup-node ships with.
      - name: npm supporting OIDC
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      - name: Gate
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Build
        run: bun run build

      - name: Bundled CLI runs under node
        run: node dist/cli.js --help

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --access public

      # A dry run against an unbumped version always collides, because the
      # registry is reached and answers honestly. That answer is the useful
      # signal: it is proof the OIDC exchange authenticated, which is the one
      # thing about trusted publishing that cannot be checked any other way.
      # Treated as success HERE ONLY — the real publish above still fails on a
      # collision, which is what should happen.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -o pipefail
          if npm publish --access public --dry-run 2>&1 | tee /tmp/publish.log; then
            echo "dry run clean — this version is publishable"
            exit 0
          fi
          if grep -q "cannot publish over the previously published versions" /tmp/publish.log; then
            echo "::notice::Authenticated to npm and the tarball is well-formed."
            echo "::notice::Version $(node -p "require('./package.json').version") is already published — bump before releasing."
            exit 0
          fi
          echo "::error::dry run failed for a reason other than a version collision"
          exit 1

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
