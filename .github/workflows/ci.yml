name: ci

# Three gates, smallest first, so a formatting slip fails in seconds rather
# than after a full pack-and-install cycle:
#
#   check    — biome, tsc, vitest against the source tree.
#   tarball  — the release checklist's §3 smoke: pack, install the artifact
#              into a scratch consumer, and drive the template through the
#              INSTALLED cli. `template.test.ts` cannot cover this, because it
#              runs the CLI from the checkout rather than from a tarball.
#   dist     — the bundled entry actually starts under plain node. The bin is
#              built by `prepublishOnly`, so nothing else would notice it
#              breaking until a publish had already gone out.
#   workflow-policy — zizmor and actionlint over .github/workflows (#24).
#
# `CI Result` is the one check to require on main: it fails unless every job
# above succeeded, so adding a job here never means editing branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run is worth nothing, so it is cancelled. A run on
# main is not: cancelling it would leave a merged commit with no verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# On GitHub-hosted runners (#21). This repo is public, so standard hosted runners
# do not draw on the org's included Actions minutes; the self-hosted Hetzner fleet
# is kept for private repos. Every job installs its own bun and node rather than
# relying on whatever the runner image happens to carry.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Pack
        run: |
          set -euo pipefail
          bun run build
          npm pack --pack-destination "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"/*.tgz

      - name: Template smoke against the installed artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/hansenexus-mechanics-*.tgz >/dev/null
          cp -R node_modules/@hansenexus/mechanics/template/. .
          npx mechanics check --app=example
          npx mechanics build --all --check
          npx mechanics report --html --out="$RUNNER_TEMP/report.html"
          test -s "$RUNNER_TEMP/report.html"

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Bundled CLI runs under node
        run: |
          set -euo pipefail
          bun run build
          node dist/cli.js --help

  # zizmor and actionlint as release binaries rather than marketplace actions:
  # both are a single static file, so a version plus a sha256 pins them as
  # tightly as a commit SHA would, and the repo's allowed-actions list does not
  # grow. This repo is public and cannot call the private hn-infra
  # workflow-policy workflow, so the same check lives here (#24). Bump a version
  # and its checksum together, from the release's own checksum list.
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install zizmor and actionlint
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C "$bin" zizmor
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"

      # Offline: the audits that need the GitHub API are skipped, which keeps
      # the result a function of the checkout alone and needs no token.
      - name: zizmor
        run: zizmor --offline --format=github --min-severity medium --min-confidence medium .github/workflows

      - name: actionlint
        run: actionlint -color

  ci-result:
    name: CI Result
    if: always()
    needs: [check, tarball, dist, workflow-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job ended as $r"
              exit 1
            fi
          done
