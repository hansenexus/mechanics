name: pages

# The marketing site and docs at mechanics.hansenexus.dev.
#
# Deliberately separate from ci.yml: a typo in a docs page must not touch the
# gates that guard a release, and a red CI run must not block a docs fix.
#
# The build does three things in order:
#   assets  — copy docs/images/*.png (generated by `bun run docs:shots`) into
#             the site, so the screenshots are never committed twice.
#   astro   — the landing page and the Starlight docs.
#   report  — run THIS checkout's CLI against examples/perch and drop the real
#             HTML report at /report/. The landing page links to it, so the
#             link has to be a real artefact rather than a picture of one.
#
# The custom domain (mechanics.hansenexus.dev) lives in the repo's Pages
# SETTINGS, not in a CNAME file. A `public/CNAME` in the artifact is how
# branch-based Pages is configured and is inert for an Actions deployment —
# this repo shipped one, and the deploy left `cname` null until the domain was
# set through the API. Kept as a comment because the file looked load-bearing
# and was not, which is the kind of thing worth writing down once:
#
#     gh api -X PUT repos/hansenexus/mechanics/pages -f cname=mechanics.hansenexus.dev

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "examples/perch/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/images/**"
      - "examples/perch/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy in flight: a half-published site is worse than a
  # slightly stale one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The root install is not optional: the report step runs `bun cli.ts`,
      # which needs the CLI's own dependencies.
      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun run build
        working-directory: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # Pull requests build but do not publish — the point of the build job on a
    # PR is to catch a broken site before it is merged, not to preview it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
