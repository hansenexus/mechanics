name: pages

# The marketing site and docs at mechanics.hansenexus.dev.
#
# Deliberately separate from ci.yml: a typo in a docs page must not touch the
# gates that guard a release, and a red CI run must not block a docs fix.
#
# The build does three things in order:
#   assets  — copy docs/images/*.png (generated by `bun run docs:shots`) into
#             the site, so the screenshots are never committed twice.
#   astro   — the landing page and the Starlight docs.
#   report  — run THIS checkout's CLI against examples/perch and drop the real
#             HTML report at /report/. The landing page links to it, so the
#             link has to be a real artefact rather than a picture of one.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "examples/perch/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/images/**"
      - "examples/perch/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy in flight: a half-published site is worse than a
  # slightly stale one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The root install is not optional: the report step runs `bun cli.ts`,
      # which needs the CLI's own dependencies.
      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    # Pull requests build but do not publish — the point of the build job on a
    # PR is to catch a broken site before it is merged, not to preview it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
