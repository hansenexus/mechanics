wave: 2026-08-redesign
title: Dashboard redesign — behaviour parity
status: open
startedAt: 2026-08-03
baselineSha: 4f52860

# System mechanics are out of scope: this wave is a front-end redesign, and
# nothing it touches can change how the probe runner or the crons behave.
# Narrowing the scope is what keeps the ratio meaningful — a denominator
# padded with things the wave cannot affect makes a wave look worse than it is
# and tells nobody anything.
scope:
  areas: []
  kinds: [user-facing]
  ids: []
  exclude:
    # Draft: no surface exists yet, so there is nothing to verify.
    - perch.status-page.custom-domain

# Absent entry = pending. `pass` requires evidence — there is no way to record
# a green verdict without saying what made it green.
verifications:
  - mechanic: perch.monitors.create-monitor
    status: pass
    method: e2e
    evidence: e2e/monitors.spec.ts
    verifiedBy: mechanics-cli
    verifiedAt: 2026-08-11

  - mechanic: perch.monitors.edit-monitor
    status: pass
    method: e2e
    evidence: e2e/monitors.spec.ts
    verifiedBy: mechanics-cli
    verifiedAt: 2026-08-11

  - mechanic: perch.monitors.list-monitors
    status: fail
    method: e2e
    evidence: e2e/monitors.spec.ts
    failedCriteria: [AC1, AC3]
    verifiedBy: mechanics-cli
    verifiedAt: 2026-08-12
    note: >-
      The redesigned list sorts by name within state, so failing monitors are
      no longer guaranteed onto the first page at 50+ monitors. AC1 and AC3
      are one bug, not two.

